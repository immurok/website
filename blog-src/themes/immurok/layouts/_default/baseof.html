<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  <div id="cookie-banner" role="dialog" aria-label="Cookie consent" hidden>
    <p>We use analytics cookies to understand how visitors use the site.
       You can accept or reject — your choice is remembered.</p>
    <div class="cookie-banner-actions">
      <button type="button" id="cookie-reject">Reject</button>
      <button type="button" id="cookie-accept">Accept</button>
    </div>
  </div>

  <script>
    document.querySelector('.nav-toggle')?.addEventListener('click', function() {
      var links = document.querySelector('.nav-links');
      var open = links.classList.toggle('open');
      this.setAttribute('aria-expanded', open);
    });

    // Nav scroll state — matches main site (style.css .nav.scrolled).
    (function(){
      var nav = document.getElementById('nav');
      if (!nav) return;
      var onScroll = function(){ nav.classList.toggle('scrolled', window.scrollY > 20); };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();

    // Anti-scrape email: reassemble from reversed data-eu/data-ed parts so the
    // raw HTML never contains the address, "@", or a mail link.
    document.querySelectorAll('a[data-eu][data-ed]').forEach(function(a){
      var rev = function(s){ return s.split('').reverse().join(''); };
      var addr = rev(a.dataset.eu) + '@' + rev(a.dataset.ed);
      a.href = 'mailto:' + addr;
      a.textContent = addr;
      a.removeAttribute('data-eu');
      a.removeAttribute('data-ed');
    });

    (function(){
      var banner = document.getElementById('cookie-banner');
      if (!banner) return;
      var accept = document.getElementById('cookie-accept');
      var reject = document.getElementById('cookie-reject');
      window.__showConsentBanner = function(){ banner.hidden = false; };
      if (window.__needsConsent) window.__showConsentBanner();
      accept.addEventListener('click', function(){
        window.__acceptConsent && window.__acceptConsent();
        banner.hidden = true;
      });
      reject.addEventListener('click', function(){
        window.__rejectConsent && window.__rejectConsent();
        banner.hidden = true;
      });
    })();
  </script>
</body>
</html>
